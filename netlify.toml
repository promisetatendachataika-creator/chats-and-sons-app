[build]
  command = "npm run build"
  publish = "dist"

# Built JS/CSS files have a content hash in their name, so phones can keep them forever
# and never re-download them on repeat visits.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be checked so new deploys show up straight away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
